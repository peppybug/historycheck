<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Historycheck banner</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Figtree"; src: url("../../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
  :root { --paper: #f3f3f0; --surface: #ffffff; --ink: #15171c; --ink-2: #3c414b; --muted: #5b606b; --line: #d6d7d2; --line-strong: #a9aba5; --thread: #a32a1c; }
  :root[data-theme="dark"] { --paper: #111317; --surface: #181b20; --ink: #ecece8; --ink-2: #c9cbc6; --muted: #9a9ea6; --line: #2b2f36; --line-strong: #4a4f58; --thread: #e26a55; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font-family: "Figtree", sans-serif; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 100%; height: 100%; display: grid; padding: var(--pad); gap: var(--gap); border-top: calc(var(--s) * 6px) solid var(--thread); }
  .wide .frame { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); align-items: center; }
  .wide .name { font-size: calc(var(--s) * 68px); white-space: nowrap; }
  .wide .mark { width: calc(var(--s) * 62px); height: calc(var(--s) * 62px); }
  .wide .tagline { font-size: calc(var(--s) * 24px); }
  .wide .title { font-size: calc(var(--s) * 18px); }
  .tall .frame { grid-template-rows: auto 1fr; }

  .brand { display: flex; flex-direction: column; justify-content: center; }
  .mark-row { display: flex; align-items: center; gap: calc(var(--s) * 18px); }
  .mark { flex-shrink: 0; width: calc(var(--s) * 78px); height: calc(var(--s) * 78px); }
  .name { font-family: "Newsreader", serif; font-weight: 600; font-size: calc(var(--s) * 92px); letter-spacing: -0.015em; line-height: 1; }
  .tagline { margin-top: calc(var(--s) * 22px); font-size: calc(var(--s) * 28px); color: var(--ink-2); line-height: 1.3; }
  .url { margin-top: calc(var(--s) * 14px); font-size: calc(var(--s) * 18px); color: var(--muted); letter-spacing: 0.01em; }

  .thread { position: relative; height: 100%; min-height: calc(var(--s) * 260px); }
  .thread svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .nodes { position: absolute; left: 0; right: 0; top: var(--axis); display: grid; grid-template-columns: repeat(6, 1fr); }
  .node { position: relative; padding: 0 calc(var(--s) * 5px); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .dot { width: calc(var(--s) * 20px); height: calc(var(--s) * 20px); border-radius: 50%; background: var(--thread); border: calc(var(--s) * 4px) solid var(--paper); transform: translateY(-50%); }
  .year { margin-top: calc(var(--s) * 6px); font-size: calc(var(--s) * 15px); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .title { margin-top: calc(var(--s) * 3px); font-family: "Newsreader", serif; font-size: calc(var(--s) * 21px); line-height: 1.15; max-width: 8em; text-wrap: balance; }
  .legend { position: absolute; right: 0; bottom: 0; display: flex; gap: calc(var(--s) * 22px); font-size: calc(var(--s) * 14px); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: calc(var(--s) * 8px); }
  .legend svg { position: static; width: calc(var(--s) * 30px); height: 6px; }
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <div class="mark-row">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3" width="2.6" height="18" rx="0.6" fill="var(--ink)" />
        <rect x="17.4" y="3" width="2.6" height="18" rx="0.6" fill="var(--ink)" />
        <rect x="1" y="11.1" width="22" height="1.8" rx="0.9" fill="var(--ink)" />
        <circle cx="12" cy="12" r="3.1" fill="var(--thread)" stroke="var(--paper)" stroke-width="1.4" />
      </svg>
      <span class="name">Historycheck</span>
    </div>
    <p class="tagline">Explore the past. Understand the present.</p>
    <p class="url">peppybug.github.io/historycheck</p>
  </div>

  <div class="thread" id="thread">
    <svg id="arcs" aria-hidden="true"></svg>
    <div class="nodes">
      <!-- A real chain from the record, with the relation types it stores. -->
      <div class="node" data-id="press"><span class="dot"></span><span class="year">c. 1455</span><span class="title">Gutenberg's printing press</span></div>
      <div class="node" data-id="theses"><span class="dot"></span><span class="year">1517</span><span class="title">Ninety‑five Theses</span></div>
      <div class="node" data-id="trent"><span class="dot"></span><span class="year">1545</span><span class="title">Council of Trent</span></div>
      <div class="node" data-id="storm"><span class="dot"></span><span class="year">1566</span><span class="title">Beeldenstorm</span></div>
      <div class="node" data-id="war"><span class="dot"></span><span class="year">1568</span><span class="title">Eighty Years' War</span></div>
      <div class="node" data-id="peace"><span class="dot"></span><span class="year">1648</span><span class="title">Peace of Westphalia</span></div>
    </div>
    <div class="legend">
      <span><svg viewBox="0 0 30 6"><line x1="0" y1="3" x2="30" y2="3" stroke="var(--thread)" stroke-width="2.5" /></svg>led to</span>
      <span><svg viewBox="0 0 30 6"><line x1="0" y1="3" x2="30" y2="3" stroke="var(--thread)" stroke-width="2" stroke-dasharray="6 4" /></svg>contributed to</span>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get("w") || 1500), h = +(q.get("h") || 500);
  if (q.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  const wide = w / h >= 2.2;
  const s = wide ? h / 500 : w / 1200;
  const r = document.documentElement.style;
  document.documentElement.className = wide ? "wide" : "tall";
  r.setProperty("--w", w + "px"); r.setProperty("--h", h + "px"); r.setProperty("--s", s);
  r.setProperty("--pad", wide ? `${56 * s}px ${84 * s}px` : `${64 * s}px ${72 * s}px ${48 * s}px`);
  r.setProperty("--gap", wide ? `${84 * s}px` : `${36 * s}px`);
  r.setProperty("--axis", `${(wide ? 0.56 : 0.5) * 100}%`);

  // Relations exactly as stored in the database (content/*.ts).
  const links = [
    ["press", "theses", "contributed_to", 1],
    ["theses", "trent", "contributed_to", 1],
    ["theses", "storm", "contributed_to", 2],
    ["storm", "war", "contributed_to", 1],
    ["war", "peace", "led_to", 1],
  ];
  document.fonts.ready.then(() => {
    const box = document.getElementById("thread").getBoundingClientRect();
    const svg = document.getElementById("arcs");
    const pos = (id) => { const d = document.querySelector(`[data-id="${id}"] .dot`).getBoundingClientRect(); return [d.left + d.width / 2 - box.left, d.top + d.height / 2 - box.top]; };
    const ns = "http://www.w3.org/2000/svg";
    const first = pos("press"), last = pos("peace");
    const axis = document.createElementNS(ns, "line");
    Object.entries({ x1: 0, x2: box.width, y1: first[1], y2: first[1], stroke: "var(--line-strong)", "stroke-width": 1.5 * s }).forEach(([k, v]) => axis.setAttribute(k, v));
    svg.appendChild(axis);
    for (const [a, b, type, tier] of links) {
      const [xa, y] = pos(a), [xb] = pos(b);
      const x1 = xa + 7 * s, x2 = xb - 7 * s;
      const lift = (tier === 2 ? 118 : 72) * s;
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", `M${x1},${y - 12 * s} C${x1},${y - lift} ${x2},${y - lift} ${x2},${y - 12 * s}`);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "var(--thread)");
      p.setAttribute("stroke-width", (type === "led_to" ? 2.8 : 2.2) * s);
      p.setAttribute("stroke-linecap", "round");
      if (type !== "led_to") p.setAttribute("stroke-dasharray", `${7 * s} ${5 * s}`);
      svg.appendChild(p);
      const head = document.createElementNS(ns, "path");
      const hs = 7 * s;
      head.setAttribute("d", `M${x2 - hs * 0.7},${y - 12 * s - hs} L${x2},${y - 12 * s} L${x2 + hs * 0.7},${y - 12 * s - hs}`);
      head.setAttribute("fill", "none"); head.setAttribute("stroke", "var(--thread)"); head.setAttribute("stroke-width", 2.4 * s); head.setAttribute("stroke-linejoin", "round"); head.setAttribute("stroke-linecap", "round");
      svg.appendChild(head);
    }
    document.body.dataset.ready = "1";
  });
</script>
</body>
</html>
